name: Sync BOT Rates

on:
  schedule:
    # 台灣時間週一至週五早上 9 點到下午 4 點，每小時自動更新一次 (UTC 時間 01:00 ~ 08:00)
    - cron: '0 1-8 * * 1-5'
  workflow_dispatch: # 支援手動一鍵觸發更新

jobs:
  update-rates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Parse BOT CSV
        shell: bash
        run: |
          python3 -c "
          import urllib.request
          import json
          import datetime

          url = 'https://rate.bot.com.tw/xrt/flcsv/0/day'
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          req = urllib.request.Request(url, headers=headers)

          rates = {
              'TWD': {'code': 'TWD', 'name': '新台幣', 'flag': '🇹🇼', 'cashSell': 1.0, 'spotSell': 1.0}
          }
          flags = {
              'USD': '🇺🇸', 'JPY': '🇯🇵', 'EUR': '🇪🇺', 'CNY': '🇨🇳', 'KRW': '🇰🇷',
              'HKD': '🇭🇰', 'GBP': '🇬🇧', 'AUD': '🇦🇺', 'CAD': '🇨🇦', 'SGD': '🇸🇬',
              'THB': '🇹🇭', 'VND': '🇻🇳'
          }

          try:
              with urllib.request.urlopen(req, timeout=15) as res:
                  content = res.read().decode('utf-8')
                  lines = content.strip().split('\n')
                  for line in lines[1:]:
                      cols = [c.strip() for c in line.split(',')]
                      if len(cols) >= 7:
                          code = cols[0]
                          name = cols[2]
                          if code in flags:
                              try:
                                  cash = float(cols[4]) if cols[4] != '-' else None
                              except:
                                  cash = None
                              try:
                                  spot = float(cols[6]) if cols[6] != '-' else None
                              except:
                                  spot = None
                              rates[code] = {
                                  'code': code,
                                  'name': name,
                                  'flag': flags[code],
                                  'cashSell': cash,
                                  'spotSell': spot
                              }
          except Exception as e:
              print(f'Error: {e}')

          output = {
              'updatedAt': datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime('%H:%M'),
              'rates': rates
          }

          with open('rates.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
          "

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git commit -m "auto: update BOT rates" || exit 0
          git push
