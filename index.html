<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>雙向匯率計算機</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input[type="text"]::-webkit-inner-spin-button,
    input[type="text"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .sheet-open { transform: translateY(0%); }
    .sheet-closed { transform: translateY(100%); }
    
    .fade-in { animation: fadeIn 0.2s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex justify-center items-center h-full sm:p-2">

<div class="w-full max-w-md bg-slate-900 sm:rounded-3xl h-full flex flex-col justify-between shadow-2xl relative overflow-hidden sm:border border-slate-800">

  <!-- 1. 頂部狀態列 -->
  <header class="px-3.5 py-2.5 bg-slate-900 border-b border-slate-800 flex justify-between items-center z-10 shrink-0">
    <div>
      <div class="flex items-center gap-2">
        <span id="statusIndicator" class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
        <h1 class="text-base font-bold tracking-tight text-white">全球即時匯率 (任選雙向)</h1>
      </div>
      <p id="rateUpdateTime" class="text-xs text-slate-300 mt-0.5 font-medium">正在同步最新匯率...</p>
    </div>
    
    <div class="flex items-center gap-2">
      <button id="refreshBtn" class="px-3 py-1.5 text-slate-200 hover:text-white bg-slate-800 rounded-lg border border-slate-700 active:scale-95 transition-all text-xs font-bold flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        重新整理
      </button>
    </div>
  </header>

  <!-- 2. 雙向輸入區塊 (上下卡片皆可自由切換幣別) -->
  <div class="px-3 py-2 flex flex-col gap-3 relative shrink-0">
    
    <!-- 上方：目標幣別輸入框 -->
    <div id="targetCard" class="h-[124px] bg-slate-800/60 border-2 border-transparent rounded-2xl p-3 shadow-sm transition-all cursor-text flex flex-col justify-between" onclick="setActiveInput('target')">
      
      <div class="flex justify-between items-start">
        <button class="flex items-center gap-2 bg-slate-700/60 hover:bg-slate-600/60 px-2.5 py-1 rounded-xl border border-slate-600/60 active:scale-95 transition-all" onclick="event.stopPropagation(); openCurrencySheet('target')">
          <span id="targetFlag" class="text-2xl">🇯🇵</span>
          <div class="flex items-baseline gap-1.5">
            <span id="targetCode" class="text-base font-bold text-white">JPY</span>
            <span id="targetName" class="text-sm font-bold text-slate-200">日圓</span>
          </div>
          <svg class="w-3.5 h-3.5 text-slate-300 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>
        <div id="targetCalcPreview" class="text-xs font-mono text-slate-300 mt-1"></div>
      </div>

      <div class="flex justify-between items-end gap-2">
        <div class="flex flex-col gap-1 z-10">
          <div id="targetRateInfo" class="text-xs text-slate-300 transition-colors font-bold">即時匯率: --</div>
          <div class="flex gap-1.5">
            <button id="editRateBtn" class="bg-slate-700 text-white px-2 py-0.5 rounded border border-slate-500 text-xs font-bold active:scale-95 shadow-sm" onclick="event.stopPropagation(); promptCustomRate()">✎ 自訂匯率</button>
            <button id="resetRateBtn" class="hidden bg-rose-900/70 text-rose-200 px-2 py-0.5 rounded border border-rose-700 text-xs font-bold active:scale-95 shadow-sm" onclick="event.stopPropagation(); resetToLiveRate()">↺ 恢復即時</button>
          </div>
        </div>
        <input 
          id="targetInput" 
          type="text" 
          inputmode="none" 
          value="1000" 
          placeholder="0"
          class="flex-1 w-0 min-w-0 bg-transparent text-4xl font-mono font-bold tracking-tight text-white text-right outline-none focus:ring-0 leading-none"
        />
      </div>
    </div>

    <!-- 中間：一鍵對調按鈕 -->
    <button onclick="swapCurrencies()" class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900 border-[3px] border-slate-900 rounded-full z-20 active:scale-90 transition-transform">
      <div class="bg-slate-800 w-8 h-8 rounded-full flex items-center justify-center text-emerald-400 shadow-inner hover:bg-slate-700 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path></svg>
      </div>
    </button>

    <!-- 下方：基準幣別輸入框 (預設 TWD，現已開放選擇) -->
    <div id="baseCard" class="h-[124px] bg-slate-850 border-2 border-emerald-500/70 rounded-2xl p-3 shadow-inner transition-all cursor-text flex flex-col justify-between" onclick="setActiveInput('base')">
      
      <div class="flex justify-between items-start">
        <button class="flex items-center gap-2 bg-slate-700/60 hover:bg-slate-600/60 px-2.5 py-1 rounded-xl border border-slate-600/60 active:scale-95 transition-all" onclick="event.stopPropagation(); openCurrencySheet('base')">
          <span id="baseFlag" class="text-2xl">🇹🇼</span>
          <div class="flex items-baseline gap-1.5">
            <span id="baseCode" class="text-base font-bold text-white">TWD</span>
            <span id="baseName" class="text-sm font-bold text-slate-200">新台幣</span>
          </div>
          <svg class="w-3.5 h-3.5 text-slate-300 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>
        <div id="baseCalcPreview" class="text-xs font-mono text-slate-300 mt-1"></div>
      </div>

      <div class="flex justify-between items-end gap-2">
        <div class="opacity-0 pointer-events-none">
          <div class="text-xs">即時匯率</div>
          <div class="flex gap-1.5"><button class="px-2 py-0.5 text-xs">自訂</button></div>
        </div>
        <input 
          id="baseInput" 
          type="text" 
          inputmode="none" 
          placeholder="0"
          class="flex-1 w-0 min-w-0 bg-transparent text-4xl font-mono font-bold tracking-tight text-emerald-300 text-right outline-none focus:ring-0 leading-none"
        />
      </div>
    </div>
  </div>

  <!-- 3. 明細與附加費率 -->
  <div class="px-3.5 flex flex-col flex-1 relative pt-1 pb-1 justify-center">
    <div id="breakdownBox" class="hidden bg-slate-950 border border-slate-800 rounded-xl p-2.5 mb-2 text-xs font-mono font-bold shadow-inner space-y-1 fade-in">
      <div class="flex justify-between text-slate-300">
        <span>原始折合：</span><span id="bdRaw">0.00</span>
      </div>
      <div id="bdTaxRow" class="flex justify-between text-emerald-400 hidden">
        <span id="bdTaxLabel">免稅退稅 (10%)：</span><span id="bdTax">-0.00</span>
      </div>
      <div id="bdFeeRow" class="flex justify-between text-rose-400 hidden">
        <span id="bdFeeLabel">海外刷卡 (1.5%)：</span><span id="bdFee">+0.00</span>
      </div>
    </div>

    <div class="flex items-center justify-between">
      <div class="flex items-center gap-1.5 text-slate-300 text-sm font-bold">
        <span>附加計算</span>
        <button onclick="promptCustomAddon()" class="flex items-center justify-center w-6 h-6 bg-slate-800 hover:bg-slate-700 rounded-full border border-slate-600 active:scale-95 transition-all text-slate-200 shadow-sm text-xs">
          ⚙️
        </button>
      </div>
      <div class="flex gap-2">
        <button id="toggleFee" class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800 text-slate-200 text-sm font-bold font-mono active:scale-95 transition-all shadow-sm">+1.5% 刷卡</button>
        <button id="toggleTax" class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800 text-slate-200 text-sm font-bold font-mono active:scale-95 transition-all shadow-sm">-10% 退稅</button>
      </div>
    </div>
  </div>

  <!-- 4. 虛擬計算機鍵盤 -->
  <div class="bg-slate-950 p-2.5 pb-4 rounded-t-2xl border-t border-slate-800/90 shadow-2xl shrink-0">
    <div class="grid grid-cols-4 gap-1.5 text-xl font-semibold">
      <button class="key-btn bg-slate-800 hover:bg-slate-700 text-rose-400 py-2.5 rounded-xl active:scale-95 transition-transform" data-val="C">C</button>
      <button class="key-btn bg-slate-800 hover:bg-slate-700 text-emerald-400 py-2.5 rounded-xl active:scale-95 transition-transform" data-val="⌫">⌫</button>
      <button class="key-btn bg-slate-800 hover:bg-slate-700 text-emerald-400 py-2.5 rounded-xl active:scale-95 transition-transform" data-val="%">%</button>
      <button class="key-btn bg-emerald-700/80 hover:bg-emerald-600 text-white py-2.5 rounded-xl active:scale-95 transition-transform" data-val="/">÷</button>

      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-2.5 rounded-xl active:scale-95 transition-transform" data-val="7">7</button>
      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-2.5 rounded-xl active:scale-95 transition-transform" data-val="8">8</button>
      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-2.5 rounded-xl active:scale-95 transition-transform" data-val="9">9</button>
      <button class="key-btn bg-emerald-700/80 hover:bg-emerald-600 text-white py-2.5 rounded-xl active:scale-95 transition-transform" data-val="*">×</button>

      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-2.5 rounded-xl active:scale-95 transition-transform" data-val="4">4</button>
      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-2.5 rounded-xl active:scale-95 transition-transform" data-val="5">5</button>
      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-2.5 rounded-xl active:scale-95 transition-transform" data-val="6">6</button>
      <button class="key-btn bg-emerald-700/80 hover:bg-emerald-600 text-white py-2.5 rounded-xl active:scale-95 transition-transform" data-val="-">-</button>

      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-2.5 rounded-xl active:scale-95 transition-transform" data-val="1">1</button>
      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-2.5 rounded-xl active:scale-95 transition-transform" data-val="2">2</button>
      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-2.5 rounded-xl active:scale-95 transition-transform" data-val="3">3</button>
      <button class="key-btn bg-emerald-700/80 hover:bg-emerald-600 text-white py-2.5 rounded-xl active:scale-95 transition-transform" data-val="+">+</button>

      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-2.5 rounded-xl col-span-2 active:scale-95 transition-transform" data-val="0">0</button>
      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-2.5 rounded-xl active:scale-95 transition-transform" data-val=".">.</button>
      <button class="key-btn bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl active:scale-95 transition-transform" data-val="=">=</button>
    </div>
  </div>

  <!-- 5. 抽屜式外幣選擇選單 -->
  <div id="currencySheetOverlay" class="absolute inset-0 bg-black/60 z-40 hidden opacity-0 transition-opacity duration-300" onclick="closeCurrencySheet()"></div>
  <div id="currencySheet" class="absolute bottom-0 left-0 right-0 bg-slate-900 rounded-t-2xl h-[65%] z-50 sheet-closed transition-transform duration-300 flex flex-col border-t border-slate-700">
    <div class="px-4 py-3 border-b border-slate-800 flex justify-between items-center">
      <h3 class="text-base font-bold text-white">選擇外幣</h3>
      <button onclick="closeCurrencySheet()" class="p-1.5 bg-slate-800 rounded-full text-slate-300 active:scale-95"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
    </div>
    <div id="sheetList" class="flex-1 overflow-y-auto p-3 grid grid-cols-2 gap-2.5 pb-8 content-start">
    </div>
  </div>

</div>

<script>
const defaultRates = {
  "TWD": { code: "TWD", name: "新台幣", flag: "🇹🇼", rate: 1.0 },
  "USD": { code: "USD", name: "美金", flag: "🇺🇸", rate: 32.48 },
  "JPY": { code: "JPY", name: "日圓", flag: "🇯🇵", rate: 0.2185 },
  "EUR": { code: "EUR", name: "歐元", flag: "🇪🇺", rate: 35.25 },
  "CNY": { code: "CNY", name: "人民幣", flag: "🇨🇳", rate: 4.52 },
  "KRW": { code: "KRW", name: "韓元", flag: "🇰🇷", rate: 0.0252 },
  "HKD": { code: "HKD", name: "港幣", flag: "🇭🇰", rate: 4.18 },
  "GBP": { code: "GBP", name: "英鎊", flag: "🇬🇧", rate: 42.30 },
  "AUD": { code: "AUD", name: "澳幣", flag: "🇦🇺", rate: 21.65 },
  "CAD": { code: "CAD", name: "加拿大幣", flag: "🇨🇦", rate: 23.80 },
  "SGD": { code: "SGD", name: "新加坡幣", flag: "🇸🇬", rate: 24.60 },
  "THB": { code: "THB", name: "泰銖", flag: "🇹🇭", rate: 0.98 },
  "VND": { code: "VND", name: "越南盾", flag: "🇻🇳", rate: 0.0014 }
};

let currentRates = JSON.parse(localStorage.getItem('global_rates_cache')) || defaultRates;
// 全新自訂匯率儲存方式 (支援雙向組合，如 JPY_TWD)
let customCrossRates = JSON.parse(localStorage.getItem('custom_pairs_cache')) || {};

// 初始化預設幣別 (下方永遠預設 TWD)
let targetCode = 'JPY';
let baseCode = 'TWD';

let feeRate = parseFloat(localStorage.getItem('custom_fee_rate')) || 1.5;
let taxRate = parseFloat(localStorage.getItem('custom_tax_rate')) || 10.0;

let activeInputType = 'target'; 
let applyFee = false;
let applyTaxFree = false;
let sheetMode = 'target'; // 記錄是哪一個卡片打開了選單

const baseInput = document.getElementById('baseInput');
const targetInput = document.getElementById('targetInput');

function updateAddonButtons() {
  const feeBtn = document.getElementById('toggleFee');
  const taxBtn = document.getElementById('toggleTax');

  feeBtn.textContent = `+${feeRate}% 刷卡`;
  taxBtn.textContent = `-${taxRate}% 退稅`;

  const activeFeeClass = "px-3 py-1.5 rounded-lg border border-emerald-500 bg-emerald-950 text-emerald-300 text-sm font-bold font-mono active:scale-95 transition-all shadow-sm";
  const inactiveClass = "px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800 text-slate-200 text-sm font-bold font-mono active:scale-95 transition-all shadow-sm";

  feeBtn.className = applyFee ? activeFeeClass : inactiveClass;
  taxBtn.className = applyTaxFree ? activeFeeClass : inactiveClass;

  document.getElementById('bdTaxLabel').textContent = `免稅退稅 (${taxRate}%)：`;
  document.getElementById('bdFeeLabel').textContent = `海外刷卡 (${feeRate}%)：`;
  
  render();
}

function promptCustomAddon() {
  const newTax = prompt(`請輸入您要設定的【退稅】百分比\n(預設為10。若百貨收手續費可自行填入實退趴數，例如8.45)：`, taxRate);
  if (newTax !== null && !isNaN(parseFloat(newTax))) {
    taxRate = parseFloat(newTax);
    localStorage.setItem('custom_tax_rate', taxRate);
  }
  
  const newFee = prompt(`請輸入您要設定的【海外刷卡手續費】百分比\n(台灣信用卡一般為1.5)：`, feeRate);
  if (newFee !== null && !isNaN(parseFloat(newFee))) {
    feeRate = parseFloat(newFee);
    localStorage.setItem('custom_fee_rate', feeRate);
  }
  updateAddonButtons();
}

document.getElementById('toggleFee').addEventListener('click', () => {
  applyFee = !applyFee;
  updateAddonButtons();
});

document.getElementById('toggleTax').addEventListener('click', () => {
  applyTaxFree = !applyTaxFree;
  updateAddonButtons();
});

function evalSafe(expr) {
  try {
    let sanitized = String(expr).replace(/[^\d.+\-*/%]/g, '');
    if (!sanitized) return 0;
    sanitized = sanitized.replace(/[+\-*/%]+$/, '');
    if (!sanitized) return 0;
    sanitized = sanitized.replace(/(\d+(\.\d+)?)%/g, '($1*0.01)');
    const res = new Function(`return (${sanitized});`)();
    return isFinite(res) ? Math.max(0, res) : 0;
  } catch {
    return 0;
  }
}

function setActiveInput(type) {
  activeInputType = type;
  const targetCard = document.getElementById('targetCard');
  const baseCard = document.getElementById('baseCard');
  const tInput = document.getElementById('targetInput');
  const bInput = document.getElementById('baseInput');

  if (type === 'target') {
    targetCard.classList.add('border-emerald-500/70', 'bg-slate-850');
    targetCard.classList.remove('border-transparent', 'bg-slate-800/60');
    tInput.classList.add('text-emerald-300');
    tInput.classList.remove('text-white');
    baseCard.classList.remove('border-emerald-500/70', 'bg-slate-850');
    baseCard.classList.add('border-transparent', 'bg-slate-800/60');
    bInput.classList.remove('text-emerald-300');
    bInput.classList.add('text-white');
  } else {
    baseCard.classList.add('border-emerald-500/70', 'bg-slate-850');
    baseCard.classList.remove('border-transparent', 'bg-slate-800/60');
    bInput.classList.add('text-emerald-300');
    bInput.classList.remove('text-white');
    targetCard.classList.remove('border-emerald-500/70', 'bg-slate-850');
    targetCard.classList.add('border-transparent', 'bg-slate-800/60');
    tInput.classList.remove('text-emerald-300');
    tInput.classList.add('text-white');
  }
  render();
}

// 一鍵上下對調幣別
function swapCurrencies() {
  let temp = targetCode;
  targetCode = baseCode;
  baseCode = temp;
  render();
}

function promptCustomRate() {
  const liveRate = (currentRates[targetCode].rate / currentRates[baseCode].rate);
  const pairKey = `${targetCode}_${baseCode}`;
  
  const userRate = prompt(`請輸入您自訂的匯率：\n(目前即時匯率: 1 ${targetCode} = ${liveRate.toFixed(4)} ${baseCode})`, customCrossRates[pairKey] || liveRate.toFixed(4));
  
  if (userRate !== null) {
    const parsed = parseFloat(userRate);
    if (!isNaN(parsed) && parsed > 0) {
      customCrossRates[pairKey] = parsed;
      localStorage.setItem('custom_pairs_cache', JSON.stringify(customCrossRates));
      render();
    } else {
      alert("請輸入有效的數字匯率！");
    }
  }
}

function resetToLiveRate() {
  const pairKey = `${targetCode}_${baseCode}`;
  delete customCrossRates[pairKey];
  localStorage.setItem('custom_pairs_cache', JSON.stringify(customCrossRates));
  render();
}

function render() {
  // 自動換算任意兩種幣別的交叉匯率
  const liveRate = currentRates[targetCode].rate / currentRates[baseCode].rate;
  const pairKey = `${targetCode}_${baseCode}`;
  const isCustom = customCrossRates[pairKey] !== undefined;
  const rateValue = isCustom ? customCrossRates[pairKey] : liveRate;
  
  // 更新上方卡片 UI
  document.getElementById('targetFlag').textContent = currentRates[targetCode].flag;
  document.getElementById('targetCode').textContent = targetCode;
  document.getElementById('targetName').textContent = currentRates[targetCode].name;
  
  // 更新下方卡片 UI
  document.getElementById('baseFlag').textContent = currentRates[baseCode].flag;
  document.getElementById('baseCode').textContent = baseCode;
  document.getElementById('baseName').textContent = currentRates[baseCode].name;
  
  const rateInfoEl = document.getElementById('targetRateInfo');
  rateInfoEl.textContent = `${isCustom ? '自訂匯率' : '即時匯率'}: 1 ${targetCode} = ${rateValue.toFixed(4)} ${baseCode}`;
  
  if (isCustom) {
    rateInfoEl.classList.add('text-amber-400');
    rateInfoEl.classList.remove('text-slate-300');
    document.getElementById('editRateBtn').classList.add('hidden');
    document.getElementById('resetRateBtn').classList.remove('hidden');
  } else {
    rateInfoEl.classList.add('text-slate-300');
    rateInfoEl.classList.remove('text-amber-400');
    document.getElementById('editRateBtn').classList.remove('hidden');
    document.getElementById('resetRateBtn').classList.add('hidden');
  }

  const inputStr = activeInputType === 'target' ? targetInput.value : baseInput.value;
  const rawActive = evalSafe(inputStr);
  const hasEq = /[+\-*/%]/.test(inputStr);

  if (activeInputType === 'target') {
    document.getElementById('targetCalcPreview').textContent = hasEq ? `≈ ${rawActive.toFixed(2)}` : '';
    document.getElementById('baseCalcPreview').textContent = '';
  } else {
    document.getElementById('baseCalcPreview').textContent = hasEq ? `≈ ${rawActive.toFixed(2)}` : '';
    document.getElementById('targetCalcPreview').textContent = '';
  }
  
  let rawConverted = 0;
  if (activeInputType === 'target') {
    rawConverted = rawActive * rateValue;
  } else {
    rawConverted = rawActive / rateValue;
  }

  let currentAmount = rawConverted;
  let taxAmount = 0;
  let feeAmount = 0;

  if (applyTaxFree) {
    taxAmount = currentAmount * (taxRate / 100); 
    currentAmount -= taxAmount;
  }
  
  if (applyFee) {
    feeAmount = currentAmount * (feeRate / 100); 
    currentAmount += feeAmount;
  }

  const outStr = (rawActive === 0 && inputStr !== '0') ? "" : Number(currentAmount.toFixed(2)).toString();
  if (activeInputType === 'target') {
    baseInput.value = outStr || "0";
  } else {
    targetInput.value = outStr || "0";
  }

  const bdBox = document.getElementById('breakdownBox');
  if (applyTaxFree || applyFee) {
    bdBox.classList.remove('hidden');
    // 明細的幣別符號會根據計算方向動態變化
    const symbol = activeInputType === 'target' ? baseCode : targetCode;
    document.getElementById('bdRaw').textContent = `${rawConverted.toFixed(2)} ${symbol}`;
    
    if (applyTaxFree) {
      document.getElementById('bdTaxRow').classList.remove('hidden');
      document.getElementById('bdTax').textContent = `- ${taxAmount.toFixed(2)} ${symbol}`;
    } else {
      document.getElementById('bdTaxRow').classList.add('hidden');
    }

    if (applyFee) {
      document.getElementById('bdFeeRow').classList.remove('hidden');
      document.getElementById('bdFee').textContent = `+ ${feeAmount.toFixed(2)} ${symbol}`;
    } else {
      document.getElementById('bdFeeRow').classList.add('hidden');
    }
  } else {
    bdBox.classList.add('hidden');
  }
}

function handleKeyPress(val) {
  const targetEl = activeInputType === 'target' ? targetInput : baseInput;
  let cur = targetEl.value;

  if (val === 'C') {
    targetEl.value = "0";
  } else if (val === '⌫') {
    targetEl.value = cur.length > 1 ? cur.slice(0, -1) : "0";
  } else if (val === '=') {
    const res = evalSafe(cur);
    targetEl.value = String(Number(res.toFixed(4)));
  } else {
    const ops = ['+', '-', '*', '/', '%'];
    if (cur === "0" && !ops.includes(val) && val !== '.') {
      targetEl.value = val;
    } else {
      const last = cur.slice(-1);
      if (ops.includes(last) && ops.includes(val)) {
        targetEl.value = cur.slice(0, -1) + val;
      } else {
        targetEl.value += val;
      }
    }
  }
  render();
}

document.querySelectorAll('.key-btn').forEach(btn => {
  btn.addEventListener('click', () => handleKeyPress(btn.getAttribute('data-val')));
});

const sheetOverlay = document.getElementById('currencySheetOverlay');
const sheet = document.getElementById('currencySheet');

function openCurrencySheet(mode) {
  sheetMode = mode;
  buildSheetList();
  sheetOverlay.classList.remove('hidden');
  void sheetOverlay.offsetWidth;
  sheetOverlay.classList.add('opacity-100');
  sheetOverlay.classList.remove('opacity-0');
  sheet.classList.remove('sheet-closed');
  sheet.classList.add('sheet-open');
}

function closeCurrencySheet() {
  sheet.classList.add('sheet-closed');
  sheet.classList.remove('sheet-open');
  sheetOverlay.classList.remove('opacity-100');
  sheetOverlay.classList.add('opacity-0');
  setTimeout(() => sheetOverlay.classList.add('hidden'), 300);
}

function buildSheetList() {
  const container = document.getElementById('sheetList');
  container.innerHTML = ''; 
  
  Object.keys(currentRates).forEach(code => {
    const info = currentRates[code];
    const activeCode = sheetMode === 'target' ? targetCode : baseCode;
    const activeStyle = code === activeCode ? 'border-emerald-500 bg-emerald-900/30' : 'border-slate-700 bg-slate-800';
    
    const btn = document.createElement('button');
    btn.className = `flex items-center gap-3 p-3 rounded-xl border text-left transition-all active:scale-95 ${activeStyle}`;
    btn.innerHTML = `
      <span class="text-3xl">${info.flag}</span>
      <div class="flex-1">
        <div class="font-bold text-base text-white leading-none">${code}</div>
        <div class="text-sm font-bold text-slate-300 mt-1">${info.name}</div>
      </div>
    `;
    btn.onclick = () => {
      if (sheetMode === 'target') {
        targetCode = code;
      } else {
        baseCode = code;
      }
      closeCurrencySheet();
      render();
    };
    container.appendChild(btn);
  });
}

async function fetchRates() {
  const ind = document.getElementById('statusIndicator');
  const updateTimeText = document.getElementById('rateUpdateTime');
  ind.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse";
  updateTimeText.textContent = "連線全球即時匯率中...";

  try {
    const res = await fetch("https://open.er-api.com/v6/latest/TWD");
    if (!res.ok) throw new Error("API 連線失敗");
    const data = await res.json();
    
    if (data && data.result === "success" && data.rates) {
      let hasUpdate = false;
      
      Object.keys(currentRates).forEach(code => {
        if (code !== 'TWD' && data.rates[code]) {
          // 以 TWD 為底，計算 1 外幣等於多少 TWD
          const twdRate = 1 / data.rates[code];
          currentRates[code].rate = parseFloat(twdRate.toFixed(4));
          hasUpdate = true;
        }
      });
      
      if (hasUpdate) {
        localStorage.setItem('global_rates_cache', JSON.stringify(currentRates));
        ind.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
        updateTimeText.textContent = `匯率已同步 (${new Date().toLocaleTimeString('zh-TW', {hour:'2-digit',minute:'2-digit'})})`;
      }
    } else {
      throw new Error("格式錯誤");
    }
  } catch (e) {
    ind.className = "w-2.5 h-2.5 rounded-full bg-slate-500";
    updateTimeText.textContent = "使用離線快取資料";
  }

  render();
  updateAddonButtons();
}

document.getElementById('refreshBtn').addEventListener('click', fetchRates);

setActiveInput('target');
fetchRates();
</script>
