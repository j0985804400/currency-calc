<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>雙向匯率計算機</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input[type="text"]::-webkit-inner-spin-button,
    input[type="text"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .sheet-open { transform: translateY(0%); }
    .sheet-closed { transform: translateY(100%); }
    
    .fade-in { animation: fadeIn 0.2s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex justify-center items-center h-full sm:p-2">

<div class="w-full max-w-md bg-slate-900 sm:rounded-3xl h-full flex flex-col justify-between shadow-2xl relative overflow-hidden sm:border border-slate-800">

  <!-- 1. 頂部狀態列 (標題字體大幅放大至 text-lg) -->
  <header class="px-4 py-3 bg-slate-900 border-b border-slate-800 flex justify-between items-center z-10 shrink-0">
    <div>
      <div class="flex items-center gap-2">
        <span id="statusIndicator" class="w-3 h-3 rounded-full bg-amber-400"></span>
        <h1 class="text-lg font-bold tracking-tight text-white">全球即時匯率 (對向直算)</h1>
      </div>
      <p id="rateUpdateTime" class="text-sm text-slate-400 mt-1">正在同步最新匯率...</p>
    </div>
    
    <div class="flex items-center gap-2">
      <button id="refreshBtn" class="px-3 py-2 text-slate-300 hover:text-white bg-slate-800 rounded-lg border border-slate-700 active:scale-95 transition-all text-sm flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
      </button>
    </div>
  </header>

  <!-- 2. 雙向輸入區塊 -->
  <div class="flex-1 flex flex-col justify-around px-4 py-2 gap-2 relative min-h-0">
    
    <!-- 上方：外幣輸入框 -->
    <div id="targetCard" class="bg-slate-800/60 border-2 border-transparent focus-within:border-emerald-500/70 rounded-3xl p-4 shadow-sm transition-all cursor-text relative overflow-hidden" onclick="setActiveInput('target')">
      
      <!-- 幣別選擇與代碼 (字體放大 JPY text-xl, 日圓 text-sm) -->
      <button id="currencySelectBtn" class="absolute top-3 left-3 flex items-center gap-2.5 bg-slate-700/50 hover:bg-slate-600/50 px-3 py-2 rounded-xl border border-slate-600/50 active:scale-95 transition-all z-10" onclick="event.stopPropagation(); openCurrencySheet()">
        <span id="targetFlag" class="text-4xl">🇯🇵</span>
        <div class="text-left leading-tight">
          <div id="targetCode" class="text-xl font-bold text-white">JPY</div>
          <div id="targetName" class="text-sm text-slate-400">日圓</div>
        </div>
        <svg class="w-5 h-5 text-slate-400 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
      </button>

      <div class="text-right mt-14">
        <div id="targetCalcPreview" class="h-5 text-base font-mono text-slate-400 truncate"></div>
        <input 
          id="targetInput" 
          type="text" 
          inputmode="none" 
          value="1000" 
          placeholder="0"
          class="w-full bg-transparent text-6xl font-mono font-bold tracking-tight text-white text-right outline-none focus:ring-0 leading-none"
        />
      </div>
      
      <!-- 自訂匯率控制區 (文字與按鈕全面放大 text-sm) -->
      <div class="absolute bottom-3 left-4 flex items-center gap-3 z-10">
        <div id="targetRateInfo" class="text-sm text-slate-400 transition-colors font-medium">即時匯率: --</div>
        <button id="editRateBtn" class="bg-slate-700/80 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-600 text-sm active:scale-95 shadow-sm font-medium" onclick="event.stopPropagation(); promptCustomRate()">✎ 自訂</button>
        <button id="resetRateBtn" class="hidden bg-rose-900/50 text-rose-300 px-3 py-1.5 rounded-lg border border-rose-800 text-sm active:scale-95 shadow-sm font-medium" onclick="event.stopPropagation(); resetToLiveRate()">↺ 恢復即時</button>
      </div>
    </div>

    <!-- 中間：雙向交換圖示 -->
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900 border-4 border-slate-900 rounded-full z-10 pointer-events-none">
      <div class="bg-slate-800 w-10 h-10 rounded-full flex items-center justify-center text-emerald-400 shadow-inner">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path></svg>
      </div>
    </div>

    <!-- 下方：台幣輸入框 -->
    <div id="baseCard" class="bg-slate-850 border-2 border-emerald-500/70 rounded-3xl p-4 shadow-inner transition-all cursor-text relative" onclick="setActiveInput('base')">
      <!-- 幣別資訊 (字體放大 TWD text-xl, 新台幣 text-sm) -->
      <div class="absolute top-4 left-4 flex items-center gap-2.5 px-2 py-1">
        <span class="text-4xl">🇹🇼</span>
        <div class="text-left leading-tight">
          <div class="text-xl font-bold text-white">TWD</div>
          <div class="text-sm text-slate-400">新台幣</div>
        </div>
      </div>
      <div class="text-right mt-14">
        <div id="baseCalcPreview" class="h-5 text-base font-mono text-slate-400 truncate"></div>
        <input 
          id="baseInput" 
          type="text" 
          inputmode="none" 
          placeholder="0"
          class="w-full bg-transparent text-6xl font-mono font-bold tracking-tight text-emerald-300 text-right outline-none focus:ring-0 leading-none"
        />
      </div>
      <div class="h-5"></div>
    </div>
  </div>

  <!-- 3. 明細與附加費率 (字體升級至 text-sm，加入自訂趴數按鈕) -->
  <div class="px-4 flex flex-col shrink-0 relative pb-2 pt-2">
    <div id="breakdownBox" class="hidden bg-slate-950 border border-slate-800 rounded-2xl p-3.5 mb-3 text-sm font-mono shadow-inner space-y-2 fade-in">
      <div class="flex justify-between text-slate-400">
        <span>原始折合：</span><span id="bdRaw">0.00</span>
      </div>
      <div id="bdTaxRow" class="flex justify-between text-emerald-400 hidden">
        <span id="bdTaxLabel">免稅退稅 (10%)：</span><span id="bdTax">-0.00</span>
      </div>
      <div id="bdFeeRow" class="flex justify-between text-rose-400 hidden">
        <span id="bdFeeLabel">海外刷卡 (1.5%)：</span><span id="bdFee">+0.00</span>
      </div>
    </div>

    <div class="flex items-center justify-between">
      <!-- 新增：自訂手續費/退稅設定鈕 -->
      <div class="flex items-center gap-1.5 text-slate-400 text-sm font-medium">
        <span>附加計算</span>
        <button onclick="promptCustomAddon()" class="flex items-center justify-center w-7 h-7 bg-slate-800 hover:bg-slate-700 rounded-full border border-slate-700 active:scale-95 transition-all text-slate-300 shadow-sm">
          ⚙️
        </button>
      </div>
      <!-- 按鈕放大 -->
      <div class="flex gap-2.5">
        <button id="toggleFee" class="px-4 py-2.5 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 text-sm font-bold font-mono active:scale-95 transition-all shadow-sm">+1.5% 刷卡</button>
        <button id="toggleTax" class="px-4 py-2.5 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 text-sm font-bold font-mono active:scale-95 transition-all shadow-sm">-10% 退稅</button>
      </div>
    </div>
  </div>

  <!-- 4. 虛擬計算機鍵盤 -->
  <div class="bg-slate-950 p-3 pb-5 rounded-t-3xl border-t border-slate-800/90 shadow-2xl shrink-0">
    <div class="grid grid-cols-4 gap-2 text-2xl font-semibold">
      <button class="key-btn bg-slate-800 hover:bg-slate-700 text-rose-400 py-3 rounded-2xl active:scale-95 transition-transform" data-val="C">C</button>
      <button class="key-btn bg-slate-800 hover:bg-slate-700 text-emerald-400 py-3 rounded-2xl active:scale-95 transition-transform" data-val="⌫">⌫</button>
      <button class="key-btn bg-slate-800 hover:bg-slate-700 text-emerald-400 py-3 rounded-2xl active:scale-95 transition-transform" data-val="%">%</button>
      <button class="key-btn bg-emerald-700/80 hover:bg-emerald-600 text-white py-3 rounded-2xl active:scale-95 transition-transform" data-val="/">÷</button>

      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-3 rounded-2xl active:scale-95 transition-transform" data-val="7">7</button>
      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-3 rounded-2xl active:scale-95 transition-transform" data-val="8">8</button>
      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-3 rounded-2xl active:scale-95 transition-transform" data-val="9">9</button>
      <button class="key-btn bg-emerald-700/80 hover:bg-emerald-600 text-white py-3 rounded-2xl active:scale-95 transition-transform" data-val="*">×</button>

      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-3 rounded-2xl active:scale-95 transition-transform" data-val="4">4</button>
      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-3 rounded-2xl active:scale-95 transition-transform" data-val="5">5</button>
      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-3 rounded-2xl active:scale-95 transition-transform" data-val="6">6</button>
      <button class="key-btn bg-emerald-700/80 hover:bg-emerald-600 text-white py-3 rounded-2xl active:scale-95 transition-transform" data-val="-">-</button>

      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-3 rounded-2xl active:scale-95 transition-transform" data-val="1">1</button>
      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-3 rounded-2xl active:scale-95 transition-transform" data-val="2">2</button>
      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-3 rounded-2xl active:scale-95 transition-transform" data-val="3">3</button>
      <button class="key-btn bg-emerald-700/80 hover:bg-emerald-600 text-white py-3 rounded-2xl active:scale-95 transition-transform" data-val="+">+</button>

      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-3 rounded-2xl col-span-2 active:scale-95 transition-transform" data-val="0">0</button>
      <button class="key-btn bg-slate-800/50 hover:bg-slate-700/80 text-white py-3 rounded-2xl active:scale-95 transition-transform" data-val=".">.</button>
      <button class="key-btn bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-2xl active:scale-95 transition-transform" data-val="=">=</button>
    </div>
  </div>

  <!-- 5. 抽屜式外幣選擇選單 -->
  <div id="currencySheetOverlay" class="absolute inset-0 bg-black/60 z-40 hidden opacity-0 transition-opacity duration-300" onclick="closeCurrencySheet()"></div>
  <div id="currencySheet" class="absolute bottom-0 left-0 right-0 bg-slate-900 rounded-t-3xl h-[70%] z-50 sheet-closed transition-transform duration-300 flex flex-col border-t border-slate-700">
    <div class="px-5 py-4 border-b border-slate-800 flex justify-between items-center">
      <h3 class="text-lg font-bold text-white">選擇外幣</h3>
      <button onclick="closeCurrencySheet()" class="p-2.5 bg-slate-800 rounded-full text-slate-400 active:scale-95"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
    </div>
    <div id="sheetList" class="flex-1 overflow-y-auto p-4 grid grid-cols-2 gap-3 pb-8 content-start">
    </div>
  </div>

</div>

<script>
const defaultRates = {
  "TWD": { code: "TWD", name: "新台幣", flag: "🇹🇼", rate: 1.0 },
  "USD": { code: "USD", name: "美金", flag: "🇺🇸", rate: 32.48 },
  "JPY": { code: "JPY", name: "日圓", flag: "🇯🇵", rate: 0.2185 },
  "EUR": { code: "EUR", name: "歐元", flag: "🇪🇺", rate: 35.25 },
  "CNY": { code: "CNY", name: "人民幣", flag: "🇨🇳", rate: 4.52 },
  "KRW": { code: "KRW", name: "韓元", flag: "🇰🇷", rate: 0.0252 },
  "HKD": { code: "HKD", name: "港幣", flag: "🇭🇰", rate: 4.18 },
  "GBP": { code: "GBP", name: "英鎊", flag: "🇬🇧", rate: 42.30 },
  "AUD": { code: "AUD", name: "澳幣", flag: "🇦🇺", rate: 21.65 },
  "CAD": { code: "CAD", name: "加拿大幣", flag: "🇨🇦", rate: 23.80 },
  "SGD": { code: "SGD", name: "新加坡幣", flag: "🇸🇬", rate: 24.60 },
  "THB": { code: "THB", name: "泰銖", flag: "🇹🇭", rate: 0.98 },
  "VND": { code: "VND", name: "越南盾", flag: "🇻🇳", rate: 0.0014 }
};

let currentRates = JSON.parse(localStorage.getItem('global_rates_cache')) || defaultRates;
let customRates = JSON.parse(localStorage.getItem('custom_rates_cache')) || {};

// 新增：動態讀取自訂的刷卡與退稅趴數
let feeRate = parseFloat(localStorage.getItem('custom_fee_rate')) || 1.5;
let taxRate = parseFloat(localStorage.getItem('custom_tax_rate')) || 10.0;

let activeCurrencyCode = 'JPY'; 
let activeInputType = 'target'; 
let applyFee = false;
let applyTaxFree = false;

const baseInput = document.getElementById('baseInput');
const targetInput = document.getElementById('targetInput');

// 更新附加計算的按鈕文字與狀態
function updateAddonButtons() {
  const feeBtn = document.getElementById('toggleFee');
  const taxBtn = document.getElementById('toggleTax');

  feeBtn.textContent = `+${feeRate}% 刷卡`;
  taxBtn.textContent = `-${taxRate}% 退稅`;

  const activeFeeClass = "px-4 py-2.5 rounded-xl border border-emerald-500 bg-emerald-950 text-emerald-300 text-sm font-bold font-mono active:scale-95 transition-all shadow-sm";
  const inactiveClass = "px-4 py-2.5 rounded-xl border border-slate-700 bg-slate-800 text-slate-300 text-sm font-bold font-mono active:scale-95 transition-all shadow-sm";

  feeBtn.className = applyFee ? activeFeeClass : inactiveClass;
  taxBtn.className = applyTaxFree ? activeFeeClass : inactiveClass;

  document.getElementById('bdTaxLabel').textContent = `免稅退稅 (${taxRate}%)：`;
  document.getElementById('bdFeeLabel').textContent = `海外刷卡 (${feeRate}%)：`;
  
  render();
}

// 觸發自訂趴數設定
function promptCustomAddon() {
  const newTax = prompt(`請輸入您要設定的【退稅】百分比\n(預設為10。若百貨收手續費可自行填入實退趴數，例如8.45)：`, taxRate);
  if (newTax !== null && !isNaN(parseFloat(newTax))) {
    taxRate = parseFloat(newTax);
    localStorage.setItem('custom_tax_rate', taxRate);
  }
  
  const newFee = prompt(`請輸入您要設定的【海外刷卡手續費】百分比\n(台灣信用卡一般為1.5)：`, feeRate);
  if (newFee !== null && !isNaN(parseFloat(newFee))) {
    feeRate = parseFloat(newFee);
    localStorage.setItem('custom_fee_rate', feeRate);
  }
  updateAddonButtons();
}

// 切換按鈕綁定
document.getElementById('toggleFee').addEventListener('click', () => {
  applyFee = !applyFee;
  updateAddonButtons();
});

document.getElementById('toggleTax').addEventListener('click', () => {
  applyTaxFree = !applyTaxFree;
  updateAddonButtons();
});

function evalSafe(expr) {
  try {
    let sanitized = String(expr).replace(/[^\d.+\-*/%]/g, '');
    if (!sanitized) return 0;
    sanitized = sanitized.replace(/[+\-*/%]+$/, '');
    if (!sanitized) return 0;
    sanitized = sanitized.replace(/(\d+(\.\d+)?)%/g, '($1*0.01)');
    const res = new Function(`return (${sanitized});`)();
    return isFinite(res) ? Math.max(0, res) : 0;
  } catch {
    return 0;
  }
}

function setActiveInput(type) {
  activeInputType = type;
  const targetCard = document.getElementById('targetCard');
  const baseCard = document.getElementById('baseCard');
  const tInput = document.getElementById('targetInput');
  const bInput = document.getElementById('baseInput');

  if (type === 'target') {
    targetCard.classList.add('border-emerald-500/70', 'bg-slate-850');
    targetCard.classList.remove('border-transparent', 'bg-slate-800/60');
    tInput.classList.add('text-emerald-300');
    tInput.classList.remove('text-white');
    baseCard.classList.remove('border-emerald-500/70', 'bg-slate-850');
    baseCard.classList.add('border-transparent', 'bg-slate-800/60');
    bInput.classList.remove('text-emerald-300');
    bInput.classList.add('text-white');
  } else {
    baseCard.classList.add('border-emerald-500/70', 'bg-slate-850');
    baseCard.classList.remove('border-transparent', 'bg-slate-800/60');
    bInput.classList.add('text-emerald-300');
    bInput.classList.remove('text-white');
    targetCard.classList.remove('border-emerald-500/70', 'bg-slate-850');
    targetCard.classList.add('border-transparent', 'bg-slate-800/60');
    tInput.classList.remove('text-emerald-300');
    tInput.classList.add('text-white');
  }
  render();
}

function promptCustomRate() {
  const currentLive = currentRates[activeCurrencyCode].rate.toFixed(4);
  const userRate = prompt(`請輸入您自訂的 ${activeCurrencyCode} 匯率：\n(目前即時匯率為 ${currentLive})`, customRates[activeCurrencyCode] || currentLive);
  
  if (userRate !== null) {
    const parsed = parseFloat(userRate);
    if (!isNaN(parsed) && parsed > 0) {
      customRates[activeCurrencyCode] = parsed;
      localStorage.setItem('custom_rates_cache', JSON.stringify(customRates));
      render();
    } else {
      alert("請輸入有效的數字匯率！");
    }
  }
}

function resetToLiveRate() {
  delete customRates[activeCurrencyCode];
  localStorage.setItem('custom_rates_cache', JSON.stringify(customRates));
  render();
}

function render() {
  const isCustom = customRates[activeCurrencyCode] !== undefined;
  const rateValue = isCustom ? customRates[activeCurrencyCode] : (currentRates[activeCurrencyCode].rate || 1.0);
  
  document.getElementById('targetFlag').textContent = currentRates[activeCurrencyCode].flag;
  document.getElementById('targetCode').textContent = activeCurrencyCode;
  document.getElementById('targetName').textContent = currentRates[activeCurrencyCode].name;
  
  const rateInfoEl = document.getElementById('targetRateInfo');
  rateInfoEl.textContent = `${isCustom ? '自訂匯率' : '即時匯率'}: 1 ${activeCurrencyCode} = ${rateValue.toFixed(4)} TWD`;
  
  if (isCustom) {
    rateInfoEl.classList.add('text-amber-400');
    rateInfoEl.classList.remove('text-slate-400');
    document.getElementById('editRateBtn').classList.add('hidden');
    document.getElementById('resetRateBtn').classList.remove('hidden');
  } else {
    rateInfoEl.classList.add('text-slate-400');
    rateInfoEl.classList.remove('text-amber-400');
    document.getElementById('editRateBtn').classList.remove('hidden');
    document.getElementById('resetRateBtn').classList.add('hidden');
  }

  const inputStr = activeInputType === 'target' ? targetInput.value : baseInput.value;
  const rawActive = evalSafe(inputStr);
  const hasEq = /[+\-*/%]/.test(inputStr);

  if (activeInputType === 'target') {
    document.getElementById('targetCalcPreview').textContent = hasEq ? `≈ ${rawActive.toFixed(2)}` : '';
    document.getElementById('baseCalcPreview').textContent = '';
  } else {
    document.getElementById('baseCalcPreview').textContent = hasEq ? `≈ ${rawActive.toFixed(2)}` : '';
    document.getElementById('targetCalcPreview').textContent = '';
  }
  
  let rawConverted = 0;
  if (activeInputType === 'target') {
    rawConverted = rawActive * rateValue;
  } else {
    rawConverted = rawActive / rateValue;
  }

  let currentAmount = rawConverted;
  let taxAmount = 0;
  let feeAmount = 0;

  // 使用動態變數計算
  if (applyTaxFree) {
    taxAmount = currentAmount * (taxRate / 100); 
    currentAmount -= taxAmount;
  }
  
  if (applyFee) {
    feeAmount = currentAmount * (feeRate / 100); 
    currentAmount += feeAmount;
  }

  const outStr = (rawActive === 0 && inputStr !== '0') ? "" : Number(currentAmount.toFixed(2)).toString();
  if (activeInputType === 'target') {
    baseInput.value = outStr || "0";
  } else {
    targetInput.value = outStr || "0";
  }

  const bdBox = document.getElementById('breakdownBox');
  if (applyTaxFree || applyFee) {
    bdBox.classList.remove('hidden');
    const symbol = activeInputType === 'target' ? "TWD" : activeCurrencyCode;
    document.getElementById('bdRaw').textContent = `${rawConverted.toFixed(2)} ${symbol}`;
    
    if (applyTaxFree) {
      document.getElementById('bdTaxRow').classList.remove('hidden');
      document.getElementById('bdTax').textContent = `- ${taxAmount.toFixed(2)} ${symbol}`;
    } else {
      document.getElementById('bdTaxRow').classList.add('hidden');
    }

    if (applyFee) {
      document.getElementById('bdFeeRow').classList.remove('hidden');
      document.getElementById('bdFee').textContent = `+ ${feeAmount.toFixed(2)} ${symbol}`;
    } else {
      document.getElementById('bdFeeRow').classList.add('hidden');
    }
  } else {
    bdBox.classList.add('hidden');
  }
}

function handleKeyPress(val) {
  const targetEl = activeInputType === 'target' ? targetInput : baseInput;
  let cur = targetEl.value;

  if (val === 'C') {
    targetEl.value = "0";
  } else if (val === '⌫') {
    targetEl.value = cur.length > 1 ? cur.slice(0, -1) : "0";
  } else if (val === '=') {
    const res = evalSafe(cur);
    targetEl.value = String(Number(res.toFixed(4)));
  } else {
    const ops = ['+', '-', '*', '/', '%'];
    if (cur === "0" && !ops.includes(val) && val !== '.') {
      targetEl.value = val;
    } else {
      const last = cur.slice(-1);
      if (ops.includes(last) && ops.includes(val)) {
        targetEl.value = cur.slice(0, -1) + val;
      } else {
        targetEl.value += val;
      }
    }
  }
  render();
}

document.querySelectorAll('.key-btn').forEach(btn => {
  btn.addEventListener('click', () => handleKeyPress(btn.getAttribute('data-val')));
});

const sheetOverlay = document.getElementById('currencySheetOverlay');
const sheet = document.getElementById('currencySheet');

function openCurrencySheet() {
  sheetOverlay.classList.remove('hidden');
  void sheetOverlay.offsetWidth;
  sheetOverlay.classList.add('opacity-100');
  sheetOverlay.classList.remove('opacity-0');
  sheet.classList.remove('sheet-closed');
  sheet.classList.add('sheet-open');
}

function closeCurrencySheet() {
  sheet.classList.add('sheet-closed');
  sheet.classList.remove('sheet-open');
  sheetOverlay.classList.remove('opacity-100');
  sheetOverlay.classList.add('opacity-0');
  setTimeout(() => sheetOverlay.classList.add('hidden'), 300);
}

function buildSheetList() {
  const container = document.getElementById('sheetList');
  container.innerHTML = ''; 
  
  Object.keys(currentRates).filter(c => c !== 'TWD').forEach(code => {
    const info = currentRates[code];
    const btn = document.createElement('button');
    const activeStyle = code === activeCurrencyCode ? 'border-emerald-500 bg-emerald-900/30' : 'border-slate-700 bg-slate-800';
    
    const isCustom = customRates[code] !== undefined;
    const customBadge = isCustom ? `<span class="bg-amber-500/20 text-amber-400 text-xs px-2 py-0.5 rounded ml-2">自訂</span>` : '';

    btn.className = `flex items-center gap-3 p-3.5 rounded-2xl border text-left transition-all active:scale-95 ${activeStyle}`;
    btn.innerHTML = `
      <span class="text-4xl">${info.flag}</span>
      <div class="flex-1">
        <div class="font-bold text-lg text-white leading-none flex items-center">${code} ${customBadge}</div>
        <div class="text-sm text-slate-400 mt-1.5">${info.name}</div>
      </div>
    `;
    btn.onclick = () => {
      activeCurrencyCode = code;
      buildSheetList(); 
      closeCurrencySheet();
      render();
    };
    container.appendChild(btn);
  });
}

async function fetchRates() {
  const ind = document.getElementById('statusIndicator');
  const updateTimeText = document.getElementById('rateUpdateTime');
  ind.className = "w-3 h-3 rounded-full bg-amber-400 animate-pulse";
  updateTimeText.textContent = "連線全球即時匯率中...";

  try {
    const res = await fetch("https://open.er-api.com/v6/latest/TWD");
    if (!res.ok) throw new Error("API 連線失敗");
    const data = await res.json();
    
    if (data && data.result === "success" && data.rates) {
      let hasUpdate = false;
      
      Object.keys(currentRates).forEach(code => {
        if (code !== 'TWD' && data.rates[code]) {
          const twdRate = 1 / data.rates[code];
          currentRates[code].rate = parseFloat(twdRate.toFixed(4));
          hasUpdate = true;
        }
      });
      
      if (hasUpdate) {
        localStorage.setItem('global_rates_cache', JSON.stringify(currentRates));
        ind.className = "w-3 h-3 rounded-full bg-emerald-400";
        updateTimeText.textContent = `匯率已同步 (${new Date().toLocaleTimeString('zh-TW', {hour:'2-digit',minute:'2-digit'})})`;
      }
    } else {
      throw new Error("格式錯誤");
    }
  } catch (e) {
    ind.className = "w-3 h-3 rounded-full bg-slate-500";
    updateTimeText.textContent = "使用離線快取資料";
  }

  buildSheetList();
  updateAddonButtons(); // 初始化按鈕文字與狀態
}

document.getElementById('refreshBtn').addEventListener('click', fetchRates);

setActiveInput('target');
buildSheetList();
fetchRates();
</script>
